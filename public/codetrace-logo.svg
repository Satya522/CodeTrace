<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150">
  <defs>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B259" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 110px;
      font-weight: 900;
      letter-spacing: -3px;
    }
    .white { fill: #FFFFFF; }
    .green { fill: url(#greenGlow); filter: url(#glow); }
  </style>
  
  <text x="400" y="110" text-anchor="middle" class="title">
    <tspan class="white">Code</tspan><tspan class="green">Trace</tspan>
  </text>
</svg>
