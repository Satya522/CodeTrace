<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B259" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 110px;
      font-weight: 900;
      letter-spacing: -3px;
    }
    .white { fill: #FFFFFF; }
    .green { fill: url(#greenGlow); filter: url(#glow); }
    
    .subtitle {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 26px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .desc {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 18px;
      font-weight: 400;
      fill: #A1A1AA;
      letter-spacing: 0px;
    }
  </style>
  
  <rect width="100%" height="100%" fill="#050505" rx="16" />
  
  <text x="400" y="110" text-anchor="middle" class="title">
    <tspan class="white">Code</tspan><tspan class="green">Trace</tspan>
  </text>
  
  <text x="400" y="170" text-anchor="middle" class="subtitle">
    See your code think. Step by step.
  </text>
  
  <text x="400" y="215" text-anchor="middle" class="desc">
    A next-generation interactive execution engine that visualizes call stacks, heap
  </text>
  <text x="400" y="243" text-anchor="middle" class="desc">
    memory, and algorithm flows in real-time — bridging the gap between
  </text>
  <text x="400" y="271" text-anchor="middle" class="desc">
    abstract code and physical execution.
  </text>
</svg>
